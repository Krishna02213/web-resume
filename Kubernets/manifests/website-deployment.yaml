apiVersion: apps/v1
kind: Deployment
metadata:
  name: website
  namespace: krishna
spec:
  replicas: 1
  selector:
    matchLabels:
      app: website
  template:
    metadata:
      labels:
        app: website
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: website
          image: krishna-database-web:v1
          imagePullPolicy: Never
          env:
            - name: STORAGE_DIR
              value: /data
          volumeMounts:
            - name: website-files
              mountPath: /data
          envFrom:
            - configMapRef:
                name: database-config
            - secretRef:
                name: database-secret
          ports:
            - containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: website-files
          persistentVolumeClaim:
            claimName: website-files
