apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]

    remote_write:
      - url: https://prometheus-prod-43-prod-ap-south-1.grafana.net/api/prom/push
        basic_auth:
          username: "3789982"
          password_file: /etc/grafana-cloud/token