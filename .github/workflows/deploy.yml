name: Portfolio Docker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    concurrency:
      group: portfolio-${{ github.ref }}
      cancel-in-progress: false

    env:
      IMAGE: portfolio:${{ github.sha }}

    steps:
      - name: Download repository code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t "$IMAGE" ./docker

      - name: Validate Nginx configuration
        run: docker run --rm "$IMAGE" nginx -t

      - name: Test the website inside Docker
        shell: bash
        run: |
          set -euo pipefail

          docker run -d --name portfolio-test \
            -p 127.0.0.1:8080:80 "$IMAGE"

          trap 'docker logs portfolio-test; docker rm -f portfolio-test' EXIT

          curl --fail --silent --show-error \
            --retry 10 --retry-all-errors \
            --connect-timeout 3 --max-time 5 \
            --retry-delay 1 \
            http://127.0.0.1:8080/ -o /tmp/home.html

          grep -q 'id="hero-title"' /tmp/home.html

          for path in styles.css script.js assets/favicon.svg assets/krishna-sen-resume.pdf; do
            curl --fail --silent --show-error \
              "http://127.0.0.1:8080/$path" -o /dev/null
          done
